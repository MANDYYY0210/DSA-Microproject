<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Campus Route Planner</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b2430;--mut:#6b7686;--bd:#d9dee8;--pri:#2b6cb0;--ok:#2e8b57;--bad:#c53030;--nd:#dce6f5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141b;--card:#1a212c;--tx:#e8edf5;--mut:#9aa6b8;--bd:#2c3646;--pri:#63a4f0;--ok:#4cc38a;--bad:#f27a7a;--nd:#27364d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141b;--card:#1a212c;--tx:#e8edf5;--mut:#9aa6b8;--bd:#2c3646;--pri:#63a4f0;--ok:#4cc38a;--bad:#f27a7a;--nd:#27364d;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:12px}
h1{font-size:18px;margin:0 0 2px}p.s{margin:0 0 10px;color:var(--mut);font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
select,input,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 8px;min-width:0}
input{flex:1 1 80px}select{flex:1 1 100px}
button{background:var(--pri);color:#fff;border:0;font-weight:600;cursor:pointer}button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
svg{width:100%;height:auto;touch-action:none;background:var(--card);border:1px solid var(--bd);border-radius:12px;display:block}
.e{stroke:var(--mut);stroke-width:2;opacity:.7}.e.on{stroke:var(--ok);stroke-width:5;opacity:1}
.n{fill:var(--nd);stroke:var(--pri);stroke-width:2;cursor:grab}.n.s{fill:var(--pri)}.n.t{fill:var(--ok)}.n.r{stroke:var(--ok);stroke-width:3}
.l{font-size:9px;fill:var(--tx);text-anchor:middle;pointer-events:none}.w{font-size:9px;fill:var(--mut);text-anchor:middle;paint-order:stroke;stroke:var(--card);stroke-width:3px}
#out{font-size:14px}.ok{color:var(--ok);font-weight:700}.no{color:var(--bad);font-weight:700}
pre{margin:0;font-size:11px;white-space:pre-wrap;color:var(--mut)}h2{font-size:13px;margin:0 0 4px}
</style></head><body>
<h1>Smart Campus / City Route Planner</h1>
<p class="s">Adjacency List · BFS · Min-Heap Dijkstra. Tap two locations, or use the menus. Drag to move.</p>
<svg id="svg" viewBox="0 0 360 300"></svg>
<div class="card" style="margin-top:10px">
 <div class="row" style="margin-top:0"><select id="src"></select><select id="dst"></select><button id="go">Find route</button></div>
 <div id="out" style="margin-top:8px">Pick a source and destination.</div>
</div>
<div class="card"><h2>Add location</h2>
 <div class="row" style="margin-top:0"><input id="nm" placeholder="Name" maxlength="20"><button id="addn">Add</button></div>
 <h2 style="margin-top:10px">Add / remove path</h2>
 <div class="row" style="margin-top:0"><select id="ea"></select><select id="eb"></select><input id="ew" type="number" placeholder="Metres" style="flex:0 1 90px"></div>
 <div class="row"><button id="adde">Add path</button><button id="rme" class="g">Remove path</button><button id="rst" class="g">Reset sample</button></div>
 <div id="msg" style="margin-top:6px;font-size:13px;min-height:18px"></div></div>
<div class="card"><h2>Adjacency List</h2><pre id="al"></pre></div>
<script>
"use strict";
const NS="http://www.w3.org/2000/svg",$=id=>document.getElementById(id);
let nodes,edges,route=[],S=-1,T=-1;
function sample(){
 nodes=[["Main Gate",50,150],["Admin Block",130,60],["Computer Lab",290,60],["Library",150,230],["Seminar Hall",290,230],["Hostel",335,150]].map(([name,x,y])=>({name,x,y}));
 edges=[[0,3,120],[0,1,80],[1,2,100],[3,2,150],[3,4,90],[2,4,60]].map(([a,b,w])=>({a,b,w}));
 route=[];S=T=-1;}
/* Adjacency List */
function adjList(){const A=nodes.map(()=>[]);edges.forEach(e=>{A[e.a].push([e.b,e.w]);A[e.b].push([e.a,e.w]);});return A;}
/* BFS reachability O(V+E) */
function bfs(A,s,t){const v=new Array(A.length).fill(false),q=[s];v[s]=true;
 for(let i=0;i<q.length;i++){const u=q[i];if(u===t)return true;for(const[x]of A[u])if(!v[x]){v[x]=true;q.push(x);}}return false;}
/* Min-Heap */
class Heap{constructor(){this.a=[];}
 push(d,v){const a=this.a;let i=a.length;a.push([d,v]);while(i>0){const p=(i-1)>>1;if(a[p][0]<=d)break;a[i]=a[p];i=p;}a[i]=[d,v];}
 pop(){const a=this.a,top=a[0],last=a.pop();if(a.length){let i=0;for(;;){let c=2*i+1;if(c>=a.length)break;if(c+1<a.length&&a[c+1][0]<a[c][0])c++;if(a[c][0]>=last[0])break;a[i]=a[c];i=c;}a[i]=last;}return top;}
 get size(){return this.a.length;}}
/* Dijkstra with Min-Heap, lazy insertion, early exit */
function dijkstra(A,s,t){const n=A.length,d=new Array(n).fill(Infinity),p=new Array(n).fill(-1),h=new Heap();
 d[s]=0;h.push(0,s);
 while(h.size){const[du,u]=h.pop();if(du>d[u])continue;if(u===t)break;
  for(const[v,w]of A[u])if(d[u]+w<d[v]){d[v]=d[u]+w;p[v]=u;h.push(d[v],v);}}
 if(d[t]===Infinity)return null;const path=[];for(let v=t;v!==-1;v=p[v])path.push(v);return{path:path.reverse(),dist:d[t]};}
function run(){
 const out=$("out");route=[];
 if(S<0||T<0){out.textContent="Pick a source and destination.";draw();return;}
 const A=adjList(),a=nodes[S].name,b=nodes[T].name;
 const r=bfs(A,S,T);
 if(!r){out.innerHTML=`BFS reachable: <span class="no">NO</span><br>No route available from ${esc(a)} to ${esc(b)}.`;draw();return;}
 const res=dijkstra(A,S,T);route=res.path;
 let sum=0,ok=true;for(let i=0;i+1<route.length;i++){const e=A[route[i]].find(x=>x[0]===route[i+1]);if(e)sum+=e[1];else ok=false;}
 out.innerHTML=`BFS reachable: <span class="ok">YES</span><br>Route: <b>${route.map(i=>esc(nodes[i].name)).join(" → ")}</b><br>Total distance: <b>${res.dist} m</b><br><span style="color:var(--mut);font-size:12px">Edge-sum check: ${sum} m, edges exist: ${ok?"YES":"NO"}</span>`;
 draw();}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function say(t,bad){const m=$("msg");m.textContent=t;m.style.color=bad?"var(--bad)":"var(--ok)";}
/* drawing */
function el(tag,at,txt){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(txt!=null)e.textContent=txt;return e;}
function draw(){
 const svg=$("svg");svg.replaceChildren();
 const rt=new Set();for(let i=0;i+1<route.length;i++)rt.add(Math.min(route[i],route[i+1])+"-"+Math.max(route[i],route[i+1]));
 edges.forEach(e=>{const on=rt.has(Math.min(e.a,e.b)+"-"+Math.max(e.a,e.b)),A=nodes[e.a],B=nodes[e.b];
  svg.append(el("line",{x1:A.x,y1:A.y,x2:B.x,y2:B.y,class:"e"+(on?" on":"")}));
  svg.append(el("text",{x:(A.x+B.x)/2,y:(A.y+B.y)/2+3,class:"w"},e.w));});
 nodes.forEach((n,i)=>{const g=el("g",{});
  const c=el("circle",{cx:n.x,cy:n.y,r:20,class:"n"+(i===S?" s":"")+(i===T?" t":"")+(route.includes(i)?" r":"")});
  c.dataset.i=i;g.append(c);
  const words=n.name.split(" ");words.forEach((w,k)=>g.append(el("text",{x:n.x,y:n.y+3+(k-(words.length-1)/2)*10,class:"l",fill:(i===S||i===T)?"#fff":""},w)));
  svg.append(g);});
 fillSel();adj();}
function adj(){const A=adjList();$("al").textContent=nodes.map((n,i)=>n.name+(A[i].length?" → "+A[i].map(([v,w])=>nodes[v].name+"("+w+")").join(", "):" (isolated)")).join("\n");}
function fillSel(){for(const id of["src","dst","ea","eb"]){const s=$(id),v=s.value;s.replaceChildren();
  if(id==="src"||id==="dst")s.append(new Option("— "+(id==="src"?"source":"destination")+" —",-1));
  nodes.forEach((n,i)=>s.append(new Option(n.name,i)));
  if(id==="src")s.value=S;else if(id==="dst")s.value=T;else s.value=v||0;if(s.value==="")s.value=id==="src"||id==="dst"?-1:0;}}
/* drag + tap */
let drag=null,moved=0;const svg=$("svg");
function pt(ev){const p=new DOMPoint(ev.clientX,ev.clientY).matrixTransform(svg.getScreenCTM().inverse());return p;}
svg.addEventListener("pointerdown",ev=>{const i=ev.target.dataset&&ev.target.dataset.i;if(i===undefined)return;drag=+i;moved=0;svg.setPointerCapture(ev.pointerId);});
svg.addEventListener("pointermove",ev=>{if(drag===null)return;const p=pt(ev);moved++;nodes[drag].x=Math.max(22,Math.min(338,p.x));nodes[drag].y=Math.max(22,Math.min(278,p.y));draw();});
svg.addEventListener("pointerup",()=>{if(drag===null)return;const i=drag;drag=null;
 if(moved<4){if(S<0||T>=0){S=i;T=-1;route=[];}else T=i;run();}});
/* controls */
$("go").onclick=()=>{S=+$("src").value;T=+$("dst").value;run();};
$("addn").onclick=()=>{const v=$("nm").value.trim();if(!v)return say("Enter a name.",1);
 if(nodes.some(n=>n.name.toLowerCase()===v.toLowerCase()))return say("Location already exists.",1);
 nodes.push({name:v,x:60+Math.random()*240,y:50+Math.random()*200});$("nm").value="";say("Location added.");draw();};
$("adde").onclick=()=>{const a=+$("ea").value,b=+$("eb").value,w=$("ew").value;
 if(w===""||isNaN(+w))return say("Enter a distance.",1);
 if(+w<0)return say("[REJECTED] negative weight — Dijkstra needs non-negative distances.",1);
 if(a===b)return say("Pick two different locations.",1);
 const ex=edges.find(e=>(e.a===a&&e.b===b)||(e.a===b&&e.b===a));
 if(ex){ex.w=+w;say("Path updated.");}else{edges.push({a,b,w:+w});say("Path added.");}route=[];run();};
$("rme").onclick=()=>{const a=+$("ea").value,b=+$("eb").value,n=edges.length;
 edges=edges.filter(e=>!((e.a===a&&e.b===b)||(e.a===b&&e.b===a)));
 say(edges.length<n?"Path removed.":"No such path.",edges.length===n);route=[];run();};
$("rst").onclick=()=>{sample();$("out").textContent="Pick a source and destination.";say("Sample campus restored.");draw();};
sample();draw();
</script></body></html>
